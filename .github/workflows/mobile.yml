name: Mobile clients
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available in SDK repositories.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build Go AAR
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-mobile.sh android
      - name: Build Android APK
        run: gradle -p apps/android --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: |
            dist/tunnelcore-android.aar
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Go XCFramework
        run: bash scripts/build-mobile.sh ios
      - name: Generate Xcode project
        run: xcodegen generate --spec apps/ios/project.yml
      - name: Build unsigned iOS app and extension
        run: |
          xcodebuild -project apps/ios/Socks5Proxy.xcodeproj \
            -scheme Socks5Proxy -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dist/ios-build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent dist/TunnelCore.xcframework dist/TunnelCore.xcframework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-client
          path: |
            dist/TunnelCore.xcframework.zip
            dist/ios-build/Build/Products/Debug-iphonesimulator/
