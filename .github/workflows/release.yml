name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: bash scripts/build-desktop.sh

      - name: Package Wintun for Windows tunnel mode
        run: |
          curl -fsSL \
            https://www.wintun.net/builds/wintun-0.14.1.zip \
            -o /tmp/wintun-0.14.1.zip
          printf '%s  %s\n' \
            '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51' \
            '/tmp/wintun-0.14.1.zip' | sha256sum -c -
          unzip -q /tmp/wintun-0.14.1.zip -d /tmp/wintun
          for arch in amd64 arm64; do
            package="socks5proxy_client_windows_${arch}"
            mkdir -p "/tmp/$package"
            cp "dist/$package.exe" "/tmp/$package/"
            cp "/tmp/wintun/wintun/bin/$arch/wintun.dll" "/tmp/$package/"
            cp /tmp/wintun/wintun/LICENSE.txt "/tmp/$package/WINTUN_LICENSE.txt"
            (cd /tmp && zip -q -r "$GITHUB_WORKSPACE/dist/$package.zip" "$package")
          done

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Install cosign
        if: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums
        if: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          cosign sign-blob \
            --key env://COSIGN_PRIVATE_KEY \
            --output-signature dist/SHA256SUMS.sig \
            dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
