name: Socks5Proxy
options:
  bundleIdPrefix: com.shikanon
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Override BUNDLE_ID_PREFIX and DEVELOPMENT_TEAM for device signing.
    BUNDLE_ID_PREFIX: com.shikanon.socks5proxy
targets:
  Socks5Proxy:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Socks5Proxy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel, Shared]
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Socks5Proxy Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).PacketTunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - framework: ../../dist/TunnelCore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: libresolv.tbd
schemes:
  Socks5Proxy:
    build:
      targets:
        Socks5Proxy: all
        PacketTunnel: all
